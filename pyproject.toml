[project]
name = "solidaritytechtools"
version = "0.3.2"
description = "Unofficial python sdk for Solidarity Tech"
readme = "README.md"
authors = [{ "name" = "Jack Klika" }]
urls = { "source" = "https://github.com/jackklika/solidaritytechtools" }
license = "MIT"

# Ensure this is as low as possible - we want as much compatibility as possible,
# especially so we have compatibility with parsonsproject.org
requires-python = ">=3.10"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
]

# Dataframe/parquet support, used by some scripts in /examples. Kept optional because pandas
# and pyarrow are ~200MB installed and nothing in the library itself imports them.
[project.optional-dependencies]
analysis = [
    "pandas>=2.2.3",
    "pyarrow>=18.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "UP", "B", "UP"]

[tool.pytest]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true

[tool.ty.src]
exclude = []
