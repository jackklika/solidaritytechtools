name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: 3.14
          activate-environment: true
      # Blocks cutting a release with a known-vulnerable dependency tree. PRs only warn,
      # so this is the point where it actually has to be clean.
      - name: Audit dependencies
        id: audit
        run: uv audit --preview-features audit-command --locked
      - name: Explain how to unblock the release
        if: failure() && steps.audit.outcome == 'failure'
        run: >-
          echo "::notice::Fix with 'uv lock --upgrade-package <name>'. If no fix is available yet,
          add the advisory id to [tool.uv.audit] ignore-until-fixed in pyproject.toml.
      - name: Build a binary wheel and a source tarball
        run: uv build
      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/solidaritytechtools
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    if: github.repository_owner == 'jackklika'
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
